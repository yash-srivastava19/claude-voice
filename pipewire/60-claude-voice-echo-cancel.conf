# Echo-cancelled mic and output for the Claude Code voice daemon (claude-voice).
# The daemon plays into claude_voice_out and records from claude_voice_mic; the WebRTC
# canceller subtracts what it played from what the mic hears. Both follow the default
# speaker and mic, and neither is meant to become a default device itself.
# Remove this file and restart pipewire to undo.
context.modules = [
  { name = libpipewire-module-echo-cancel
    args = {
      library.name = aec/libspa-aec-webrtc
      aec.args = {
        webrtc.extended_filter = true
        webrtc.noise_suppression = true
        webrtc.gain_control = true
      }
      capture.props = { node.name = "claude_voice.capture" node.passive = true }
      source.props = {
        node.name = "claude_voice_mic"
        node.description = "Claude voice mic (echo-cancelled)"
        priority.session = 1
      }
      sink.props = {
        node.name = "claude_voice_out"
        node.description = "Claude voice output (echo reference)"
        priority.session = 1
      }
      playback.props = { node.name = "claude_voice.playback" node.passive = true }
    }
  }
]
